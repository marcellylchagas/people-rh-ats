services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://people_rh:${POSTGRES_PASSWORD}@db:5432/people_rh
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      PUBLIC_BASE_URL: https://marcellylourenco.com.br
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: people_rh
      POSTGRES_USER: people_rh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - people_rh_pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U people_rh -d people_rh"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  people_rh_pg:
