<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vagas | Marcelly Chagas • Recrutamento</title><style>
:root{--pink:#d61957;--dark:#241f22;--muted:#746d70;--nude:#ead0c4;--bg:#fffaf9;--line:#eadfe2}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--dark)}header{padding:22px 6%;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}header img{height:54px;max-width:230px;object-fit:contain}header a{color:var(--pink);text-decoration:none;font-weight:700}.wrap{max-width:1180px;margin:0 auto;padding:48px 20px 70px}.eyebrow{color:var(--pink);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:13px}h1{font-size:42px;margin:8px 0 10px}.sub{color:var(--muted);max-width:720px;font-size:17px;line-height:1.6}.toolbar{margin:28px 0;display:flex;gap:12px}.search{flex:1;border:1px solid var(--line);border-radius:12px;padding:15px 16px;font-size:15px;background:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(30,20,25,.05);display:flex;flex-direction:column;min-height:290px}.card h2{font-size:21px;margin:0 0 10px}.meta{color:var(--pink);font-weight:700;font-size:13px;line-height:1.6}.desc{color:#5e575a;line-height:1.55;flex:1;margin:16px 0}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--pink);color:#fff;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;display:inline-block}.empty{padding:40px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}footer{padding:28px 6%;background:#241f22;color:#fff;text-align:center;font-size:13px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:580px){h1{font-size:32px}.grid{grid-template-columns:1fr}header{padding:16px 20px}header img{height:44px}}
</style></head><body><header><img src="./logo.png" alt="People RH ATS"><a href="/">Área do candidato / administrador →</a></header><main class="wrap"><div class="eyebrow">Marcelly Chagas • Recrutamento & Seleção</div><h1>Vagas disponíveis</h1><p class="sub">Encontre uma oportunidade alinhada ao seu perfil. Consulte os detalhes da vaga e avance para o cadastro do candidato.</p><div class="toolbar"><input id="search" class="search" placeholder="Buscar cargo, área ou cidade..." oninput="render()"></div><div id="grid" class="grid"><div class="empty">Carregando vagas...</div></div></main><footer>Recrutamento & Seleção • Uso profissional e confidencial</footer><script>
let vagas=[];const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){try{const r=await fetch('/api/public/vagas',{cache:'no-store'});if(!r.ok)throw new Error();vagas=await r.json();render();}catch(e){document.getElementById('grid').innerHTML='<div class="empty">Não foi possível carregar as vagas agora. Tente novamente em alguns instantes.</div>';}}
function render(){const q=(document.getElementById('search').value||'').toLowerCase();const requested=new URLSearchParams(location.search).get('vaga');const arr=vagas.filter(v=>(!requested||v.id===requested)&&[v.title,v.area,v.location,v.description].join(' ').toLowerCase().includes(q));document.getElementById('grid').innerHTML=arr.length?arr.map(v=>`<article class="card"><h2>${esc(v.title)}</h2><div class="meta">${esc(v.area||'Área não informada')} • ${esc(v.location||'Local a definir')}<br>${esc(v.type||'Tipo não informado')} ${v.seniority?'• '+esc(v.seniority):''}</div><div class="desc">${esc((v.description||v.responsibilities||'Confira os detalhes desta oportunidade.').slice(0,300))}${(v.description||'').length>300?'…':''}</div><a class="btn" href="/?vaga=${encodeURIComponent(v.id)}&area=candidate">Ver vaga e candidatar-se</a></article>`).join(''):'<div class="empty" style="grid-column:1/-1">Nenhuma vaga aberta encontrada.</div>'}
load();
</script></body></html>
